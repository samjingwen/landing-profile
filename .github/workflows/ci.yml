name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/samjingwen/landing-profile
  VCS_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run quality checks
        run: npm run check

      - name: Test production dispatch request
        run: scripts/test-request-production-deployment.sh

  container:
    name: ARM64 container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: landing-profile:ci
          build-args: |
            VCS_REF=${{ env.VCS_REF }}
          cache-from: type=gha,scope=landing-profile-arm64
          cache-to: type=gha,mode=max,scope=landing-profile-arm64
          provenance: false
          sbom: false

      - name: Smoke-test hardened container
        run: scripts/smoke-container.sh landing-profile:ci "$VCS_REF"

  publish:
    name: Publish approved image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - quality
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Define immutable image tags
        id: image
        run: |
          echo "candidate=${IMAGE_NAME}:candidate-master-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "approved=${IMAGE_NAME}:master-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.candidate }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=landing-profile-arm64
          cache-to: type=gha,mode=max,scope=landing-profile-arm64
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          version: v0.76.2
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/arm64

      - name: Smoke-test published digest
        run: scripts/smoke-container.sh "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" "$GITHUB_SHA"

      - name: Record post-gate approval
        run: |
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg tag "${{ steps.image.outputs.approved }}" \
            --arg digest "${{ steps.build.outputs.digest }}" \
            '{
              schema: 1,
              repository: $repository,
              ref: $ref,
              commit: $commit,
              run_id: $run_id,
              run_attempt: $run_attempt,
              approved_tag: $tag,
              digest: $digest,
              gates: {
                vulnerability_scan: "passed",
                hardened_runtime_smoke_test: "passed"
              }
            }' > "$RUNNER_TEMP/approved-image.json"

      - name: Attest post-gate approval
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://samjingwen.io/attestations/approved-image/v1
          predicate-path: ${{ runner.temp }}/approved-image.json
          push-to-registry: true
          create-storage-record: false

      - name: Promote approved image
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.approved }}" \
            "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "${{ steps.image.outputs.approved }}"

      - name: Create infrastructure dispatch token
        id: infra-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.INFRA_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_DISPATCH_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: home-k3s-infra
          permission-contents: write

      - name: Request production deployment
        env:
          APPROVED_TAG: ${{ steps.image.outputs.approved }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          scripts/request-production-deployment.sh \
            "$APPROVED_TAG" \
            "$DIGEST" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT"

      - name: Summarize approved image
        run: |
          {
            echo "## Approved image"
            echo
            echo '```text'
            echo "${{ steps.image.outputs.approved }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Production deployment was requested through the protected infrastructure workflow."
          } >> "$GITHUB_STEP_SUMMARY"
